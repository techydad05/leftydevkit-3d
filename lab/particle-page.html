<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeftyDevKit — Particle Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#050a18;--blue:#2f6fff;--blue-lt:#6ea8ff;--ink:#e8eefc;--dim:#93a4c8;--line:#1b2949;
--mono:ui-monospace,"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--ink);font-family:system-ui,Segoe UI,sans-serif;overflow-x:hidden}
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block}
/* scroll length: one full-height spacer per particle section */
.spacer{height:100vh;position:relative}
.marker{position:absolute;top:26px;left:26px;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.24em;text-transform:uppercase;opacity:.55}
#hud{position:fixed;left:14px;bottom:14px;z-index:5;font-family:var(--mono);font-size:11px;color:var(--dim);
background:rgba(5,10,24,.72);border:1px solid var(--line);border-radius:8px;padding:8px 12px;pointer-events:none}
#hud b{color:var(--blue-lt)}
#hud button{
  margin-left:10px;font-family:var(--mono);font-size:10px;color:var(--blue-lt);
  background:transparent;border:1px solid var(--line);border-radius:5px;padding:3px 8px;cursor:pointer;pointer-events:auto
}
#hud button:hover{border-color:var(--blue)}
#lablink{position:fixed;right:14px;bottom:14px;z-index:5;font-family:var(--mono);font-size:11px;color:var(--blue-lt);
text-decoration:none;background:rgba(5,10,24,.72);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
#lablink:hover{border-color:var(--blue)}
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--blue),var(--blue-lt));z-index:6}
.hint{position:fixed;top:26px;right:26px;z-index:5;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;opacity:.55}
@media (max-width:560px){ .hint{display:none} }
</style>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
}}
</script>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<div id="stage" aria-hidden="true"></div>

<main id="sections" aria-hidden="true">
  <section class="spacer"><div class="marker">01 // HERO — code. organize. resist.</div></section>
  <section class="spacer"><div class="marker">02 // WHY WE BUILD — the lone dev</div></section>
  <section class="spacer"><div class="marker">03 // THE MACHINE — the stack</div></section>
  <section class="spacer"><div class="marker">04 // TOOLS FOR THE FIGHT — the arsenal</div></section>
  <section class="spacer"><div class="marker">05 // THE DOCTRINE — read the manifesto</div></section>
  <section class="spacer"><div class="marker">06 // FREE FOR ORGANIZERS — join</div></section>
</main>

<div id="hud">PARTICLE PAGE // <b id="sec">…</b> // <span id="prog">0%</span>
  <button id="modebtn" title="toggle morph / build">build</button></div>
<a id="lablink" href="lab.html">&larr; lab</a>
<div class="hint">scroll — the page is the particles</div>

<script type="module">
import * as THREE from 'three';

const stage = document.getElementById('stage');
const hud = document.getElementById('hud');
const secEl = document.getElementById('sec');
const progEl = document.getElementById('prog');

/* ─────────── RENDERER / SCENE / ORTHO CAMERA ───────────
   Ortho (not perspective) so particle text reads flat like real
   typography and every target fits any screen aspect. */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.setClearColor(0x050a18, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -100, 100);
camera.position.z = 10;

/* fit the shared target box (8u × 4.5u) to ~85% of the viewport, either axis */
const BOX_W = 8, BOX_H = 4.5;
function fitCamera(){
  const a = stage.clientWidth / stage.clientHeight;
  if(a >= BOX_W / BOX_H){                 // wide: fit height
    const hh = BOX_H / 2 / 0.85;
    camera.left = -hh * a; camera.right = hh * a;
    camera.top = hh; camera.bottom = -hh;
  } else {                                // narrow: fit width
    const hw = BOX_W / 2 / 0.85;
    camera.left = -hw; camera.right = hw;
    camera.top = hw / a; camera.bottom = -hw / a;
  }
  camera.updateProjectionMatrix();
}
fitCamera();

/* ─────────── PIXEL SAMPLER ───────────
   Every target is drawn on the SAME 960×540 canvas, so all shapes share
   one world box and morph 1:1 — centered, no drift. */
const SAMPLES = 36000;
const CW = 960, CH = 540;
const cvs = document.createElement('canvas'); cvs.width = CW; cvs.height = CH;
const ctx = cvs.getContext('2d', { willReadFrequently: true });

function sampleBox(){
  const d = ctx.getImageData(0, 0, CW, CH).data;
  const pts = [];
  for(let y = 0; y < CH; y += 2){
    for(let x = 0; x < CW; x += 2){
      const i = (y * CW + x) * 4;
      const a = d[i + 3];
      const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
      const luma = .299 * r + .587 * g + .114 * b;
      if(a < 40 && luma < 0.10) continue;         // keep alpha OR bright
      pts.push({ x: (x / CW - .5) * BOX_W, y: -(y / CH - .5) * BOX_H, r, g, b });
    }
  }
  return pts;
}

function drawTarget(lines, icon, iconW = 190){
  ctx.clearRect(0, 0, CW, CH);
  // icon above the title (silhouette PNGs are white-on-black)
  if(icon){
    const ih = iconW * (icon.height / icon.width);
    ctx.drawImage(icon, (CW - iconW) / 2, 46, iconW, ih);
  }
  // title lines, centered stack
  const startY = icon ? 330 : 150;
  const lineH = 128;
  const n = lines.length;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((line, i) => {
    if(line.startsWith('~')){
      ctx.font = '700 44px "JetBrains Mono", monospace';
      ctx.fillStyle = '#8ab6ff';
      ctx.fillText(line.slice(1), CW / 2, startY + (i - (n - 1) / 2) * lineH * 0.62);
    } else {
      ctx.font = '900 112px "Space Grotesk", "Arial Black", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(line, CW / 2, startY + (i - (n - 1) / 2) * lineH);
    }
  });
  return sampleBox();
}

/* ─────────── PARTICLE SYSTEM ─────────── */
const pos = new Float32Array(SAMPLES * 3);
const home = new Float32Array(SAMPLES * 3);
const colA = new Float32Array(SAMPLES * 3);
const SPREAD = 6;
for(let i = 0; i < SAMPLES; i++){
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  const r = Math.pow(Math.random(), 1 / 3) * SPREAD;
  pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
  pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
  pos[i*3+2] = (Math.random() - .5) * .4;
}
const scatterStart = new Float32Array(pos);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colA, 3));
const mat = new THREE.PointsMaterial({
  size: .05, vertexColors: true, transparent: true, opacity: .92,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: false
});
const cloud = new THREE.Points(geo, mat); scene.add(cloud);

function resample(pts, n){
  const out = new Float32Array(n * 3), col = new Float32Array(n * 3);
  if(!pts.length) return { out, col };
  for(let i = 0; i < n; i++){
    const p = pts[(Math.random() * pts.length) | 0];
    const j = Math.random() * Math.PI * 2, rad = Math.random() * 0.02;
    out[i*3]   = p.x + Math.cos(j) * rad;
    out[i*3+1] = p.y + Math.sin(j) * rad;
    out[i*3+2] = (Math.random() - .5) * .05;
    col[i*3]   = p.r * 0.35 + 0.20;      // brand-tint toward LDK blue
    col[i*3+1] = p.g * 0.45 + 0.36;
    col[i*3+2] = p.b * 0.30 + 0.72;
  }
  return { out, col };
}

let TARGET_ARRAYS = [];
let curTargets = null;

/* ─────────── LOAD SOURCES & BUILD TARGETS ─────────── */
function loadImg(src){
  return new Promise((res, rej) => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => res(im); im.onerror = () => rej(new Error('load fail ' + src)); im.src = src;
  });
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const report = {};

async function buildTargets(){
  try{ await document.fonts.ready; }catch(e){}
  const fist = await loadImg('../assets/fist.png').catch(() => null);
  const desk = await loadImg('../assets/desk.png').catch(() => null);
  const gear = await loadImg('../assets/gear.png').catch(() => null);
  const court = await loadImg('../assets/courthouse.png').catch(() => null);
  const picket = await loadImg('../assets/protest.png').catch(() => null);

  const shapes = [
    { name: 'HERO — CODE. ORGANIZE. RESIST.', lines: ['CODE.', 'ORGANIZE.', 'RESIST.'], icon: fist, iconW: 200 },
    { name: 'WHY WE BUILD', lines: ['WHY WE', 'BUILD', '~system.reclaim();'], icon: desk, iconW: 210 },
    { name: 'THE MACHINE', lines: ['THE', 'MACHINE'], icon: gear, iconW: 190 },
    { name: 'TOOLS FOR THE FIGHT', lines: ['TOOLS FOR', 'THE FIGHT'], icon: court, iconW: 200 },
    { name: 'THE DOCTRINE', lines: ['READ THE', 'DOCTRINE', '~while(!free){fight();}'], icon: null },
    { name: 'FREE FOR ORGANIZERS', lines: ['FREE FOR', 'ORGANIZERS'], icon: picket, iconW: 230 },
  ];
  for(const s of shapes){
    const pts = drawTarget(s.lines, s.icon, s.iconW);
    report[s.name] = pts.length;
    TARGET_ARRAYS.push(resample(pts, SAMPLES).out);
  }
  /* colors come from the first target's resample */
  const firstCol = resample(drawTarget(shapes[0].lines, shapes[0].icon, shapes[0].iconW), SAMPLES).col;
  home.set(TARGET_ARRAYS[0]); colA.set(firstCol);
  geo.attributes.color.needsUpdate = true;

  if(reduced){
    for(let i = 0; i < SAMPLES * 3; i++) pos[i] = home[i];
    geo.attributes.position.needsUpdate = true;
  }
  secEl.textContent = shapes[0].name;
  console.log('PARTICLE_PAGE ' + JSON.stringify({ targets: shapes.map(s => s.name), counts: report, SAMPLES }));
}

/* ─────────── LOAD GATHER (scatter → first title → hold) ─────────── */
const GATHER_DUR = 2.4;
let gatherStarted = false, gT0 = 0, gatherDone = false;
function updateGather(t){
  if(!gatherStarted){ gatherStarted = true; gT0 = t + .15; }
  const k = Math.max(0, Math.min(1, (t - gT0) / GATHER_DUR));
  const s = k * k * (3 - 2 * k);
  const P = geo.attributes.position.array;
  for(let i = 0; i < SAMPLES * 3; i++) P[i] = scatterStart[i] + (home[i] - scatterStart[i]) * s;
  geo.attributes.position.needsUpdate = true;
  if(k >= 1) gatherDone = true;
}

/* ─────────── SCROLL MORPH — two modes ───────────
   MORPH: cloud = lerp(shape[ki], shape[ki+1], s) — smooth blend between
          adjacent sections (reversible, in sync with scroll).
   BUILD: each section assembles FROM SCATTER as you scroll into it (bell
          curve around the section's center), holds fully formed while you
          read it, then dissolves back to scatter as you leave. The load
          gather magic, repeated per section. */
const MORPH_K = [0, .2, .4, .6, .8, 1.0];      // section centers (build) / band starts (morph)
let mode = 'build';                            // toggle with the HUD button
window.__setMode = m => { if(m === 'morph' || m === 'build') mode = m; };
document.getElementById('modebtn').addEventListener('click', () => {
  mode = mode === 'build' ? 'morph' : 'build';
  document.getElementById('modebtn').textContent = mode;
});

function applyMorph(){
  const P = geo.attributes.position.array;
  if(mode === 'morph'){
    let ki = 0;
    for(let i = 0; i < MORPH_K.length - 1; i++) if(scrollP >= MORPH_K[i]) ki = i;
    const f = Math.min(1, Math.max(0, (scrollP - MORPH_K[ki]) / (MORPH_K[ki + 1] - MORPH_K[ki])));
    const s = f * f * (3 - 2 * f);
    const A = TARGET_ARRAYS[ki], B = TARGET_ARRAYS[ki + 1];
    for(let i = 0; i < SAMPLES * 3; i++) P[i] = A[i] + (B[i] - A[i]) * s;
    geo.attributes.position.needsUpdate = true;
    curTargets = { s, active: ki };
  } else {
    /* build: bell curve around each section center — assemble, hold, dissolve */
    const R1 = .03, R2 = .10;                   // full-hold radius / full-scatter radius
    let active = -1, wmax = 0;
    for(let i = 0; i < MORPH_K.length; i++){
      const d = Math.abs(scrollP - MORPH_K[i]);
      let w = 0;
      if(d <= R1) w = 1;
      else if(d < R2) w = 1 - (d - R1) / (R2 - R1);
      if(w > wmax){ wmax = w; active = i; }
    }
    if(active >= 0 && wmax > 0){
      const sw = wmax * wmax * (3 - 2 * wmax);
      const T = TARGET_ARRAYS[active];
      for(let i = 0; i < SAMPLES * 3; i++) P[i] = scatterStart[i] + (T[i] - scatterStart[i]) * sw;
      geo.attributes.position.needsUpdate = true;
      curTargets = { s: wmax, active };
    }
  }
}

let scrollP = 0, targetScrollP = 0;
addEventListener('scroll', () => {
  const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
  targetScrollP = Math.min(1, Math.max(0, scrollY / max));
  progEl.textContent = Math.round(targetScrollP * 100) + '%';
  const p = document.getElementById('progress');
  p.style.width = (targetScrollP * 100) + '%';
}, { passive: true });

/* pointer parallax (no scatter — the particles ARE the content) */
const mouse = { x: 0, y: 0 };
addEventListener('pointermove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = (e.clientY / innerHeight) * 2 - 1;
}, { passive: true });

let clock = new THREE.Clock();
let running = true;
document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  if(running) clock = new THREE.Clock();
});

/* ─────────── ANIMATE ─────────── */
function animate(){
  if(!running) return;
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  scrollP += (targetScrollP - scrollP) * .07;

  if(!reduced && !gatherDone){
    updateGather(t);
  } else if(!reduced && TARGET_ARRAYS.length){
    applyMorph();
    if(!gatherDone && TARGET_ARRAYS.length) gatherDone = true;
  }

  /* subtle parallax — particles move, page stays put */
  cloud.position.x = mouse.x * .35;
  cloud.position.y = -mouse.y * .22;

  renderer.render(scene, camera);
}
animate();

/* hud section name follows the active section */
const SECTION_NAMES = ['HERO — CODE. ORGANIZE. RESIST.', 'WHY WE BUILD', 'THE MACHINE', 'TOOLS FOR THE FIGHT', 'THE DOCTRINE', 'FREE FOR ORGANIZERS — JOIN'];
setInterval(() => {
  if(!curTargets) return;
  const i = Math.max(0, Math.min(SECTION_NAMES.length - 1, curTargets.active));
  secEl.textContent = SECTION_NAMES[i] + (mode === 'build' ? ' · build' : ' · morph');
}, 300);

/* verification hook */
window.__pPage = () => ({
  count: SAMPLES,
  gatherDone,
  scrollP: +scrollP.toFixed(3),
  mode,
  band: curTargets ? +curTargets.s.toFixed(3) : null,
  active: curTargets ? curTargets.active : null,
  targets: TARGET_ARRAYS.length
});

new ResizeObserver(() => {
  const w = stage.clientWidth, h = stage.clientHeight; if(!w || !h) return;
  renderer.setSize(w, h); fitCamera();
}).observe(stage);

buildTargets();
</script>
</body>
</html>
